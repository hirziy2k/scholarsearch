version: 2
updates:
  # PDF-to-PPTX (Python)
  - package-ecosystem: "pip"
    directory: "/services/pdf-engine"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"

  # PDF-to-PPTX (Docker)
  - package-ecosystem: "docker"
    directory: "/services/pdf-engine"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "docker"

  # ScholarSearch (npm)
  - package-ecosystem: "npm"
    directory: "/services/scholarsearch"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "node"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
