name: PDF-to-PPTX CI Pipeline

on:
  push:
    branches: [master, main]
    paths:
      - 'services/pdf-engine/**'
      - '.opencode/swarm/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'services/pdf-engine/**'
      - '.opencode/swarm/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pdf-engine
    
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation fonts-dejavu-core fontconfig \
            build-essential libmupdf-dev
          sudo fc-cache -fv
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate test curriculum
        run: python generate_curriculum.py
      
      - name: Run 51-document curriculum
        run: python run_curriculum.py
        timeout-minutes: 10
      
      - name: Run structural audit
        run: python structural_audit.py
      
      - name: Parse structural audit score
        id: audit
        run: |
          python -c "
          import json, sys
          with open('test_results/results.json') as f:
              data = json.load(f)
          total = len(data.get('results', []))
          passed = sum(1 for r in data.get('results', []) if r.get('success'))
          score = passed / total * 100 if total > 0 else 0
          print(f'Score: {score:.1f}%')
          if score < 99.7:
              print(f'FAIL: Score {score:.1f}% is below 99.7% threshold')
              sys.exit(1)
          print('PASS: Score meets 99.7% threshold')
          "
      
      - name: Run organic hostile tests
        run: python run_organic_tests.py
        timeout-minutes: 5
      
      - name: Run concurrency stress test
        run: python stress_test.py
        timeout-minutes: 5
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: services/pdf-engine/test_results/*.html
          retention-days: 30

  swarm-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install redis hiredis

      - name: Install Redis CLI
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Verify Redis streams (XADD/XLEN)
        run: |
          redis-cli -p 6379 ping
          redis-cli -p 6379 XADD test_stream * field value
          redis-cli -p 6379 XLEN test_stream
          redis-cli -p 6379 DEL test_stream
          echo "Streams validated on redis:7-alpine"

      - name: Run Swarm core tests
        run: python -m pytest .opencode/swarm/test_swarm.py -v

      - name: Run Swarm streams tests
        run: python -m pytest .opencode/swarm/test_streams.py -v

      - name: Run Swarm mechanic tests
        run: python -m pytest .opencode/swarm/test_mechanic.py -v

      - name: Run Swarm chaos tests
        run: python -m pytest .opencode/swarm/test_chaos.py -v

      - name: Run Swarm Day2 tests
        run: python -m pytest .opencode/swarm/test_day2.py -v
        continue-on-error: true  # Day2 operational tests may require full env

      - name: Run Swarm genesis tests
        run: python -m pytest .opencode/swarm/test_genesis.py -v
