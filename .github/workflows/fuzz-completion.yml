name: Fuzz Completion & Dead-Man Switch

on:
  repository_dispatch:
    types: [fuzz-certificate-minted, fuzz-dead-man-switch]

permissions:
  pull-requests: write
  contents: read

jobs:
  handle-fuzz-event:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Process fuzz event
        uses: actions/github-script@v7
        with:
          script: |
            const eventType = context.event_type;
            const payload = context.payload.client_payload;
            const depName = payload.dep_name;
            const depVersion = payload.dep_version;

            core.info(`Event: ${eventType}`);
            core.info(`Dependency: ${depName}@${depVersion}`);

            // Find the open Dependabot PR
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const targetPr = prs.find(pr =>
              pr.user.login === 'dependabot[bot]' &&
              pr.title.includes(depName) &&
              pr.title.includes(depVersion)
            );

            if (!targetPr) {
              core.info('No open Dependabot PR found');
              return;
            }

            if (eventType === 'fuzz-dead-man-switch') {
              // DEAD-MAN SWITCH: Force-close PR with toxic regression
              const reason = payload.reason || 'Heartbeat flatline';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: targetPr.number,
                body: [
                  '## TOXIC REGRESSION (FATAL ARREST)',
                  '',
                  '**Dead-Man Switch Triggered**',
                  '',
                  '| Field | Value |',
                  '|-------|-------|',
                  '| Dependency | ' + depName + '@' + depVersion + ' |',
                  '| Lease ID | `' + (payload.lease_id || 'unknown') + '` |',
                  '| Reason | ' + reason + ' |',
                  '| Status | `toxic_regression_fatal_arrest` |',
                  '',
                  'This PR has been force-closed by the watchdog.',
                  'The dependency update poses a catastrophic risk.',
                  '',
                  '---',
                  '*Auto-generated by dead-man\'s switch telemetry*',
                ].join('\n'),
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: targetPr.number,
                state: 'closed',
              });

              core.info(`PR #${targetPr.number} force-closed (toxic regression)`);
              return;
            }

            if (eventType === 'fuzz-certificate-minted') {
              // Certificate minted — evaluate
              const certStatus = payload.certificate_status;
              const certValid = payload.certificate_valid;
              const certHash = payload.certificate_hash;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: targetPr.number,
                body: [
                  '## FUZZ CERTIFICATE MINTED',
                  '',
                  '| Field | Value |',
                  '|-------|-------|',
                  '| Dependency | ' + depName + '@' + depVersion + ' |',
                  '| Status | ' + certStatus + ' |',
                  '| Valid | ' + certValid + ' |',
                  '| Hash | `' + (certHash || '').slice(0, 16) + '...` |',
                  '',
                  'Health certificate has been minted to immutable S3 storage.',
                ].join('\n'),
              });

              if (certValid) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: targetPr.number,
                  event: 'APPROVE',
                  body: 'Auto-approved: Health certificate verified',
                });
                core.info(`PR #${targetPr.number} approved`);
              }
            }
