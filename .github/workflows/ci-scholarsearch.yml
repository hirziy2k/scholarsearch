name: ScholarSearch CI

on:
  push:
    branches: [main]
    paths:
      - "services/scholarsearch/**"
  pull_request:
    branches: [main]
    paths:
      - "services/scholarsearch/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scholarsearch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/scholarsearch/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e-contract-gate:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/scholarsearch/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx vcrpy
      - name: Install and build ScholarSearch
        working-directory: services/scholarsearch
        run: |
          npm ci
          npm run build
      - name: Start ScholarSearch backend and wait for readiness
        working-directory: services/scholarsearch
        run: |
          (npm run start:backend > /tmp/scholarsearch.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health; then echo READY; break; fi
            sleep 2
          done
          curl -sf http://localhost:3001/health
      - name: Verify cassettes exist (air-gap enforcement)
        run: |
          if [ ! -d "tests/cassettes/scholarsearch" ]; then
            echo "ERROR: No cassettes directory found. E2E tests are air-gapped."
            exit 1
          fi
          if [ -z "$(ls -A tests/cassettes/scholarsearch/*.yaml 2>/dev/null)" ]; then
            echo "ERROR: No cassette YAML files found."
            exit 1
          fi
          echo "Cassettes verified:"
          ls tests/cassettes/scholarsearch/*.yaml
      - run: python -m pytest tests/e2e_scholarsearch.py -v --tb=short
        env:
          SCHOLARSEARCH_URL: http://localhost:3001
