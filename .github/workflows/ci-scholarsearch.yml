name: ScholarSearch CI

on:
  push:
    branches: [master]
    paths:
      - "services/scholarsearch/**"
  pull_request:
    branches: [master]
    paths:
      - "services/scholarsearch/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scholarsearch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/scholarsearch/package-lock.json
      - run: npm ci
      - run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: services/scholarsearch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/scholarsearch/package-lock.json
      - run: npm ci
      - run: npx vitest run

  e2e-contract-gate:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx vcrpy
      - name: Build ScholarSearch backend image
        run: docker build -t scholarsearch:latest -f services/scholarsearch/Dockerfile services/scholarsearch
      - name: Run ScholarSearch backend
        run: docker run -d -p 3001:3001 scholarsearch:latest
      - name: Wait for ScholarSearch readiness and extract logs on failure
        run: |
          CONTAINER_ID=$(docker ps -q -f ancestor=scholarsearch:latest)
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:3001/health; then
              echo "ScholarSearch is healthy."
              exit 0
            fi
            echo "Waiting for ScholarSearch..."
            sleep 2
          done
          echo "ScholarSearch failed to start. Extracting container logs:"
          docker logs $CONTAINER_ID
          exit 1
      - name: Verify cassettes exist (air-gap aspiration — warning only)
        run: |
          if [ ! -d "tests/cassettes/scholarsearch" ]; then
            echo "WARNING: No cassettes directory. Search tests will fail with record instructions."
          elif [ -z "$(ls -A tests/cassettes/scholarsearch/*.yaml 2>/dev/null)" ]; then
            echo "WARNING: No cassette YAML files committed. Search tests will fail with record instructions; health/validation tests still evaluate the live server."
          else
            echo "Cassettes present:"
            ls tests/cassettes/scholarsearch/*.yaml
          fi
      - run: python -m pytest tests/e2e_scholarsearch.py -v --tb=short
        env:
          SCHOLARSEARCH_URL: http://localhost:3001
