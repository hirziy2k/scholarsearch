name: E2E Contract Gate

on:
  pull_request:
    branches: [master]

jobs:
  e2e-pdf-engine:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx
      - name: Build PDF Engine image
        run: docker build -t pdf-engine:latest services/pdf-engine
      - name: Run PDF Engine
        run: docker run -d -p 8000:8000 --add-host=host.docker.internal:host-gateway -e REDIS_URL=redis://host.docker.internal:6379/0 pdf-engine:latest
      - name: Wait for PDF Engine readiness and extract logs on failure
        run: |
          CONTAINER_ID=$(docker ps -q -f ancestor=pdf-engine:latest)
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:8000/v1/health; then
              echo "PDF Engine is healthy."
              exit 0
            fi
            echo "Waiting for PDF Engine..."
            sleep 2
          done
          echo "PDF Engine failed to start. Extracting container logs:"
          docker logs $CONTAINER_ID
          exit 1
      - run: python -m pytest tests/e2e_pdf_engine.py -v --tb=short
        env:
          PDF_ENGINE_URL: http://localhost:8000

  e2e-scholarsearch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx vcrpy pyyaml
      - name: Build ScholarSearch backend image
        run: docker build -t scholarsearch:latest -f services/scholarsearch/Dockerfile services/scholarsearch
      - name: Run ScholarSearch backend
        run: docker run -d -p 3001:3001 scholarsearch:latest
      - name: Wait for ScholarSearch readiness and extract logs on failure
        run: |
          CONTAINER_ID=$(docker ps -q -f ancestor=scholarsearch:latest)
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:3001/health; then
              echo "ScholarSearch is healthy."
              exit 0
            fi
            echo "Waiting for ScholarSearch..."
            sleep 2
          done
          echo "ScholarSearch failed to start. Extracting container logs:"
          docker logs $CONTAINER_ID
          exit 1

      - name: Check for invalidated cassettes (schema drift)
        run: |
          if [ -d "tests/cassettes/scholarsearch" ]; then
            INVALID=$(ls tests/cassettes/scholarsearch/*.yaml.invalid 2>/dev/null || true)
            if [ -n "$INVALID" ]; then
              echo "ERROR: Schema drift detected. Invalidated cassettes found:"
              echo "$INVALID"
              echo ""
              echo "Cassettes were invalidated by the daily drift detector."
              echo "Re-record cassettes locally, then commit the updated files."
              exit 1
            fi
          fi

      - name: Verify cassettes exist (air-gap aspiration — warning only)
        run: |
          if [ ! -d "tests/cassettes/scholarsearch" ]; then
            echo "WARNING: No cassettes directory. Search tests will fail with record instructions."
          elif [ -z "$(ls -A tests/cassettes/scholarsearch/*.yaml 2>/dev/null)" ]; then
            echo "WARNING: No cassette YAML files committed. Search tests will fail with record instructions; health/validation tests still evaluate the live server."
          else
            echo "Valid cassettes:"
            ls tests/cassettes/scholarsearch/*.yaml
          fi

      - run: python -m pytest tests/e2e_scholarsearch.py -v --tb=short
