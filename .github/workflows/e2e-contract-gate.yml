name: E2E Contract Gate

on:
  pull_request:
    branches: [main]

jobs:
  e2e-pdf-engine:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx
      - name: Build PDF Engine image
        run: docker build -t pdf-engine:latest services/pdf-engine
      - name: Run PDF Engine
        run: docker run -d -p 8000:8000 -e REDIS_URL=redis://127.0.0.1:6379/0 pdf-engine:latest
      - name: Wait for PDF Engine readiness and extract logs on failure
        run: |
          CONTAINER_ID=$(docker ps -q -f ancestor=pdf-engine:latest)
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:8000/v1/health; then
              echo "PDF Engine is healthy."
              exit 0
            fi
            echo "Waiting for PDF Engine..."
            sleep 2
          done
          echo "PDF Engine failed to start. Extracting container logs:"
          docker logs $CONTAINER_ID
          exit 1
      - run: python -m pytest tests/e2e_pdf_engine.py -v --tb=short
        env:
          PDF_ENGINE_URL: http://localhost:8000

  e2e-scholarsearch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/scholarsearch/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx vcrpy pyyaml
      - name: Install and build ScholarSearch
        working-directory: services/scholarsearch
        run: |
          npm ci
          npm run build
      - name: Start ScholarSearch backend and wait for readiness
        working-directory: services/scholarsearch
        run: |
          (npm run start:backend > /tmp/scholarsearch.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health; then echo READY; break; fi
            sleep 2
          done
          curl -sf http://localhost:3001/health

      - name: Check for invalidated cassettes (schema drift)
        run: |
          if [ -d "tests/cassettes/scholarsearch" ]; then
            INVALID=$(ls tests/cassettes/scholarsearch/*.yaml.invalid 2>/dev/null || true)
            if [ -n "$INVALID" ]; then
              echo "ERROR: Schema drift detected. Invalidated cassettes found:"
              echo "$INVALID"
              echo ""
              echo "Cassettes were invalidated by the daily drift detector."
              echo "Re-record cassettes locally, then commit the updated files."
              exit 1
            fi
          fi

      - name: Verify cassettes exist (air-gap enforcement)
        run: |
          if [ ! -d "tests/cassettes/scholarsearch" ]; then
            echo "ERROR: No cassettes directory found. E2E tests are air-gapped."
            echo "Record cassettes locally first, then commit them."
            exit 1
          fi
          if [ -z "$(ls -A tests/cassettes/scholarsearch/*.yaml 2>/dev/null)" ]; then
            echo "ERROR: No cassette YAML files found."
            echo "Run tests locally with VCR record_mode=all to generate cassettes."
            exit 1
          fi
          echo "Valid cassettes:"
          ls tests/cassettes/scholarsearch/*.yaml

      - run: python -m pytest tests/e2e_scholarsearch.py -v --tb=short
