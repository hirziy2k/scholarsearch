name: Schema Drift Detector

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    services:
      scholarsearch:
        build:
          context: services/scholarsearch
        ports:
          - 3001:3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest httpx vcrpy pyyaml

      - name: Run surgical schema drift detection
        id: drift
        run: |
          python tests/schema_drift_detector.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Create blocking issue on critical drift only
        if: steps.drift.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[BLOCKED] Ingested field drift — cassettes invalidated`;
            const body = [
              `## Ingested Field Drift Detected`,
              ``,
              `The schema drift detector found changes to fields your application **actually ingests**.`,
              ``,
              `Peripheral field additions (unused by your app) are ignored and do not block CI.`,
              `Only modifications to ingested fields trigger this block.`,
              ``,
              `### Resolution`,
              `1. Re-record cassettes locally: run tests with VCR record mode`,
              `2. Commit updated cassettes`,
              `3. CI unblocks automatically`,
              ``,
              `---`,
              `*Auto-generated by schema-drift-detector — surgical field-level triage*`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'schema-drift',
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['schema-drift', 'blocking'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Drift re-detected at ${new Date().toISOString()}. Cassettes still invalidated.`,
              });
            }
