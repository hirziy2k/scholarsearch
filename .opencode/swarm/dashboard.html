<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarm Cascade — Intelligence Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --border: #2a2a3a;
            --text-primary: #e8e8f0;
            --text-secondary: #8888a0;
            --accent-green: #00ff88;
            --accent-yellow: #ffcc00;
            --accent-red: #ff4466;
            --accent-blue: #4488ff;
            --accent-purple: #aa66ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        .query-form {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .query-form label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .query-input-group {
            display: flex;
            gap: 12px;
        }

        .query-input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
        }

        .query-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .submit-btn {
            background: var(--accent-blue);
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            background: #5599ff;
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .card-value {
            font-size: 24px;
            font-weight: 600;
        }

        .chart-container {
            height: 200px;
            position: relative;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .boundary-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .boundary-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .boundary-text {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .chips {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chip-green {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .chip-yellow {
            background: rgba(255, 204, 0, 0.15);
            color: var(--accent-yellow);
            border: 1px solid rgba(255, 204, 0, 0.3);
        }

        .chip-red {
            background: rgba(255, 68, 102, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(255, 68, 102, 0.3);
        }

        .chip-blue {
            background: rgba(68, 136, 255, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(68, 136, 255, 0.3);
        }

        .chip-purple {
            background: rgba(170, 102, 255, 0.15);
            color: var(--accent-purple);
            border: 1px solid rgba(170, 102, 255, 0.3);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table th,
        .history-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .history-table th {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .hash {
            font-family: monospace;
            color: var(--accent-purple);
            font-size: 12px;
        }

        .timestamp {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .query-input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Swarm Cascade</h1>
        <div class="status-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="container">
        <div class="query-form">
            <label>Research Query</label>
            <div class="query-input-group">
                <input type="text" class="query-input" id="queryInput" 
                       placeholder="Enter clinical or market analysis query..."
                       value="Low-dose atropine versus orthokeratology for pediatric myopia control">
                <button class="submit-btn" id="submitBtn" onclick="submitQuery()">Execute</button>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Velocity Signal</span>
                    <span class="card-value" id="velocityValue">—</span>
                </div>
                <div class="chart-container">
                    <canvas id="velocityChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">MACD Momentum</span>
                    <span class="card-value" id="macdValue">—</span>
                </div>
                <div class="chart-container">
                    <canvas id="macdChart"></canvas>
                </div>
            </div>
        </div>

        <div class="boundary-card" id="boundaryCard" style="display: none;">
            <div class="boundary-label">Boundary Condition</div>
            <div class="boundary-text" id="boundaryText">—</div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Arbitration Status</span>
                </div>
                <div class="chips" id="arbitrationChips">
                    <span class="chip chip-blue">AWAITING QUERY</span>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Pipeline Metrics</span>
                </div>
                <div class="chips" id="pipelineChips">
                    <span class="chip chip-purple">IDLE</span>
                </div>
            </div>
        </div>

        <div class="card full-width">
            <div class="card-header">
                <span class="card-title">Query History</span>
            </div>
            <table class="history-table" id="historyTable">
                <thead>
                    <tr>
                        <th>Hash</th>
                        <th>Query</th>
                        <th>Verdict</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <tr>
                        <td colspan="4" class="empty-state">
                            <div class="empty-state-icon">◇</div>
                            No queries executed yet
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8084';
        let velocityChart, macdChart;
        let velocityData = [];
        let macdData = [];
        let signalData = [];
        let chartLabels = [];
        let queryHistory = [];

        function initCharts() {
            const velocityCtx = document.getElementById('velocityChart').getContext('2d');
            velocityChart = new Chart(velocityCtx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Velocity',
                        data: velocityData,
                        borderColor: '#00ff88',
                        backgroundColor: 'rgba(0, 255, 136, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointBackgroundColor: '#00ff88'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            display: false
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#8888a0', font: { size: 10 } }
                        }
                    }
                }
            });

            const macdCtx = document.getElementById('macdChart').getContext('2d');
            macdChart = new Chart(macdCtx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [
                        {
                            label: 'MACD',
                            data: macdData,
                            borderColor: '#4488ff',
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: '#4488ff'
                        },
                        {
                            label: 'Signal',
                            data: signalData,
                            borderColor: '#aa66ff',
                            borderDash: [5, 5],
                            tension: 0.4,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: { color: '#8888a0', font: { size: 10 }, boxWidth: 12 }
                        }
                    },
                    scales: {
                        x: {
                            display: false
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#8888a0', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function updateCharts(signal) {
            const now = new Date().toLocaleTimeString();
            
            chartLabels.push(now);
            velocityData.push(signal.velocity);
            macdData.push(signal.macd);
            signalData.push(signal.signal);

            if (chartLabels.length > 20) {
                chartLabels.shift();
                velocityData.shift();
                macdData.shift();
                signalData.shift();
            }

            velocityChart.update('none');
            macdChart.update('none');

            document.getElementById('velocityValue').textContent = signal.velocity.toFixed(2);
            document.getElementById('macdValue').textContent = signal.macd.toFixed(4);
        }

        function updateArbitration(blindMatrix, triage) {
            const chips = [];
            
            chips.push(`<span class="chip ${blindMatrix.verdict === 'HIGH_AUTHORITY' ? 'chip-green' : 'chip-yellow'}">${blindMatrix.verdict}</span>`);
            chips.push(`<span class="chip chip-purple">${blindMatrix.contradiction_type}</span>`);
            chips.push(`<span class="chip chip-blue">${triage.decision}</span>`);
            
            document.getElementById('arbitrationChips').innerHTML = chips.join('');
        }

        function updatePipeline(filterResult) {
            const chips = [];
            
            const tierColors = { 1: 'chip-green', 2: 'chip-blue', 3: 'chip-yellow', 4: 'chip-red' };
            chips.push(`<span class="chip ${tierColors[filterResult.support_tier] || 'chip-blue'}">Support T${filterResult.support_tier}</span>`);
            chips.push(`<span class="chip ${tierColors[filterResult.contradiction_tier] || 'chip-blue'}">Contradiction T${filterResult.contradiction_tier}</span>`);
            
            if (filterResult.invalidation_marker_found) {
                chips.push(`<span class="chip chip-red">Invalidation Detected</span>`);
            }
            
            document.getElementById('pipelineChips').innerHTML = chips.join('');
        }

        function updateBoundary(boundaryCondition) {
            if (boundaryCondition) {
                document.getElementById('boundaryCard').style.display = 'block';
                document.getElementById('boundaryText').textContent = boundaryCondition;
            }
        }

        function updateHistory(result) {
            const hash = result.query_hash.substring(0, 12) + '...';
            const query = result.query.length > 60 ? result.query.substring(0, 60) + '...' : result.query;
            const verdict = result.blind_matrix.verdict;
            const time = new Date(result.timestamp * 1000).toLocaleTimeString();
            
            queryHistory.unshift({ hash, query, verdict, time, result });
            
            if (queryHistory.length > 10) queryHistory.pop();
            
            const tbody = document.getElementById('historyBody');
            tbody.innerHTML = queryHistory.map(h => `
                <tr onclick="loadFromHistory('${h.hash}')" style="cursor: pointer;">
                    <td class="hash">${h.hash}</td>
                    <td>${h.query}</td>
                    <td><span class="chip ${h.verdict === 'HIGH_AUTHORITY' ? 'chip-green' : 'chip-yellow'}" style="font-size: 10px; padding: 4px 8px;">${h.verdict}</span></td>
                    <td class="timestamp">${h.time}</td>
                </tr>
            `).join('');
        }

        function loadFromHistory(hash) {
            const entry = queryHistory.find(h => h.hash === hash);
            if (entry) {
                renderResult(entry.result);
            }
        }

        async function submitQuery() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) return;
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            
            try {
                const response = await fetch(`${API_BASE}/api/research`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                
                const result = await response.json();
                renderResult(result);
                updateHistory(result);
                
            } catch (error) {
                console.error('Query failed:', error);
                alert('Failed to execute query. Check if API server is running.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Execute';
            }
        }

        function renderResult(result) {
            updateCharts(result.signal);
            updateArbitration(result.blind_matrix, result.triage);
            updatePipeline(result.methodological_filter);
            updateBoundary(result.blind_matrix.boundary_condition);
        }

        function initSSE() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            statusDot.style.background = '#00ff88';
            statusText.textContent = 'Connected';
        }

        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            initSSE();
            
            document.getElementById('queryInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitQuery();
            });
        });
    </script>
</body>
</html>
