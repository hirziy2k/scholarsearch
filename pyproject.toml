[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2pptx"
version = "0.1.0"
description = "Convert PDF presentations to PowerPoint (PPTX)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "pdf2pptx contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
    "PyMuPDF>=1.24,<2",
    "python-pptx>=0.6.23,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.52.4,<1",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
    "psutil>=6,<7",
]

[project.optional-dependencies]
redis = ["redis[hiredis]>=5.1,<6"]
aws = ["boto3>=1.35,<2"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "pip-audit>=2,<3",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "httpx>=0.27,<1",
]

[project.scripts]
pdf2pptx = "pdf2pptx.cli:main"
pdf2pptx-api = "pdf2pptx.api.server:run"

[project.urls]
Homepage = "https://github.com/pdf2pptx/pdf2pptx"
Issues = "https://github.com/pdf2pptx/pdf2pptx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2pptx"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["pdf2pptx"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pptx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
]
