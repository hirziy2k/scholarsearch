[project]
name = "academic-ai-engine"
version = "1.0.0"
description = "Academic research tools orchestrated by OpenCode AI agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "vcrpy>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["e2e_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--tb=short"]
markers = [
    "integration: marks integration tests requiring external services",
    "airgapped: marks tests that must not make live network calls",
]
