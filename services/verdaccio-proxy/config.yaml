# Verdaccio Institutional Proxy — Sigstore Provenance Verification
# ================================================================
# Intercepts npm requests and verifies cryptographically signed
# npm provenance (Sigstore) BEFORE packages reach the local network.
#
# Packages lacking verifiable author signature are REJECTED.
# Deploy alongside CI runner in an air-gapped network segment.

storage: /var/lib/verdaccio/storage
plugins: /var/lib/verdaccio/plugins

web:
  title: "Institutional npm Proxy — Sigstore Verified"
  logo: ""

auth:
  htpasswd:
    file: /var/lib/verdaccio/htpasswd
    max_users: 100

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    timeout: 30s
    maxage: 10m
    fail_timeout: 5m
    cache: true

# Provenance verification middleware
middlewares:
  sigstore-verify:
    package: verdaccio-plugin-sigstore-provenance
    options:
      enabled: true
      # Require Sigstore provenance for all packages
      require_provenance: true
      # Trusted publishers (optional whitelist)
      trusted_publishers: []
      # Rejection behavior
      reject_unsigned: true
      # Verification timeout
      timeout_ms: 10000

packages:
  # Scoped packages from organization
  "@scholarsearch/*":
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs

  # All other packages — proxy through Sigstore verification
  "**":
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs

server:
  keepAliveTimeout: 60

middlewares:
  audit:
    enabled: true

listen:
  - 0.0.0.0:4873

log: { type: stdout, format: pretty, level: http }

# Rate limiting to prevent abuse
max_body_size: 100mb

# Cache settings
cache:
  enable: true
  ttl: 24h
