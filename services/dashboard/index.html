<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dependency Dashboard — Zero-Knowledge Decryption</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #2D2D2D;
      padding: 2rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    .key-input {
      margin-bottom: 1.5rem;
      padding: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .key-input label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    .key-input input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.875rem;
    }
    .key-input button {
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      background: #2D2D2D;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .decryption-status {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
    .decryption-status.locked { background: #ffebee; color: #c62828; }
    .decryption-status.decrypting { background: #fff3e0; color: #f57c00; }
    .decryption-status.verified {
      background: #fff3e0;
      color: #2D2D2D;
    }
    .decryption-status .accent { color: #FFEB3B; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #eee; }
    th { font-weight: 600; }
    .status-clean { color: #2e7d32; }
    .status-pending { color: #f57c00; }
    .status-failed { color: #c62828; }
    #payload-count { font-size: 0.875rem; color: #666; margin-top: 1rem; }
    .ciphertext-preview {
      margin-top: 1rem;
      padding: 1rem;
      background: #f5f5f5;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.75rem;
      word-break: break-all;
      max-height: 100px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>Dependency Dashboard — Zero-Knowledge</h1>

  <div class="key-input">
    <label>Private Decryption Key (AES-256-GCM)</label>
    <input type="password" id="decryption-key" placeholder="Enter 64-character hex key...">
    <button onclick="decryptAndRender()">Decrypt & Load</button>
  </div>

  <div id="decryption-status" class="decryption-status locked">
    <span class="accent">Locked</span> Enter decryption key to view data
  </div>

  <table>
    <thead>
      <tr>
        <th>Dependency</th>
        <th>Version</th>
        <th>Status</th>
        <th>Iterations</th>
        <th>Last Updated</th>
      </tr>
    </thead>
    <tbody id="dashboard-body">
      <tr><td colspan="5">Awaiting decryption key...</td></tr>
    </tbody>
  </table>

  <div id="ciphertext-preview" class="ciphertext-preview" style="display:none;">
    <strong>Ciphertext preview:</strong><br>
    <span id="ciphertext-content"></span>
  </div>
  <div id="payload-count"></div>

  <script>
    const S3_PUBLIC_URL = 'https://YOUR_BUCKET.r2.dev/payloads/';
    const POLL_INTERVAL = 30000;
    let decryptionKey = null;

    async function deriveKey(hexKey) {
      const keyBytes = new Uint8Array(
        hexKey.match(/.{2}/g).map(byte => parseInt(byte, 16))
      );
      return crypto.subtle.importKey(
        'raw',
        keyBytes,
        { name: 'AES-GCM' },
        false,
        ['decrypt']
      );
    }

    async function decryptPayload(ciphertext, key) {
      // Decode base64
      const combined = Uint8Array.from(atob(ciphertext), c => c.charCodeAt(0));

      // Extract IV (first 12 bytes) and ciphertext
      const iv = combined.slice(0, 12);
      const encrypted = combined.slice(12);

      // Decrypt
      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv },
        key,
        encrypted
      );

      return new TextDecoder().decode(decrypted);
    }

    async function decryptAndRender() {
      const keyInput = document.getElementById('decryption-key').value.trim();
      if (keyInput.length !== 64) {
        alert('Key must be 64 hexadecimal characters');
        return;
      }

      const statusEl = document.getElementById('decryption-status');
      statusEl.className = 'decryption-status decrypting';
      statusEl.innerHTML = '<span class="accent">Decrypting...</span> Validating key';

      try {
        decryptionKey = await deriveKey(keyInput);

        // Test decryption with a sample
        statusEl.className = 'decryption-status verified';
        statusEl.innerHTML = '<span class="accent">Decryption Key Verified</span> — Loading data';

        await fetchPayloads();
      } catch (e) {
        statusEl.className = 'decryption-status locked';
        statusEl.innerHTML = '<span class="accent">Invalid Key</span> ' + e.message;
      }
    }

    async function fetchPayloads() {
      const statusEl = document.getElementById('decryption-status');
      const bodyEl = document.getElementById('dashboard-body');
      const countEl = document.getElementById('payload-count');
      const previewEl = document.getElementById('ciphertext-preview');
      const previewContent = document.getElementById('ciphertext-content');

      try {
        statusEl.innerHTML = '<span class="accent">Syncing...</span> Fetching ciphertext from S3';

        const response = await fetch(`${S3_PUBLIC_URL}manifest.json`);
        const ciphertextManifest = await response.text();

        // Show ciphertext preview
        previewEl.style.display = 'block';
        previewContent.textContent = ciphertextManifest.slice(0, 500) + '...';

        // Decrypt manifest
        const decryptedManifest = await decryptPayload(ciphertextManifest, decryptionKey);
        const data = JSON.parse(decryptedManifest);

        bodyEl.innerHTML = '';
        let totalPayloads = 0;

        for (const payload of data.payloads || []) {
          totalPayloads++;
          const row = document.createElement('tr');
          const statusClass = payload.status === 'clean' ? 'status-clean'
            : payload.status === 'pending' ? 'status-pending'
            : 'status-failed';

          row.innerHTML = `
            <td>${payload.dep_name}</td>
            <td>${payload.dep_version}</td>
            <td class="${statusClass}">${payload.status}</td>
            <td>${payload.iterations || 0}</td>
            <td>${payload.stored_at || 'N/A'}</td>
          `;
          bodyEl.appendChild(row);
        }

        if (totalPayloads === 0) {
          bodyEl.innerHTML = '<tr><td colspan="5">No payloads found</td></tr>';
        }

        countEl.textContent = `${totalPayloads} encrypted payload(s) in bucket`;

        statusEl.className = 'decryption-status verified';
        statusEl.innerHTML = '<span class="accent">Decryption Key Verified</span> — Last updated: ' + new Date().toLocaleTimeString();

      } catch (e) {
        if (e.name === 'OperationError') {
          statusEl.className = 'decryption-status locked';
          statusEl.innerHTML = '<span class="accent">Decryption Failed</span> Wrong key or corrupted data';
        } else {
          statusEl.className = 'decryption-status locked';
          statusEl.innerHTML = '<span class="accent">Error</span> ' + e.message;
        }
      }
    }
  </script>
</body>
</html>
